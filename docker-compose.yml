services:
  postgres:
    image: postgres:16-alpine
    container_name: nutaschola-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: nutaschola
      POSTGRES_PASSWORD: nutaschola
      POSTGRES_DB: nutaschola
    volumes:
      - nutaschola_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutaschola -d nutaschola"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nutaschola_pg_data:
